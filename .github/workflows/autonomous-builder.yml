name: HUNTIQ autonomous Claude builder

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

env:
  TRUST_BOOTSTRAP_WORKFLOW_BLOB: '0e5f4053fdd544c68e8591621f3288d169c83447'
  TRUST_REVIEW_WORKFLOW_BLOB: '99594e96d23d163b3cf75e54b5b8e7be4ec9cf16'
  TRUST_REVIEWER_BLOB: 'e5b93d7d00f5c7649326118d6ceab4feb3c89678'
  TRUST_TEST_WORKFLOW_BLOB: 'c53d191ea87bb0464a1a8aa840a1b90a94981597'
  TRUST_WORKTREE_AGENT_BLOB: '79ea8ef3ecdb16547c51c93bb989c905056d592c'
  TRUST_SECRET_SCANNER_BLOB: 'ab628ce2562c1b8954497e0a2751639e1e2bb950'
  TRUST_CUSTOMER_GATE_BLOB: 'a830e17f473689c7635a326ad2b7d00217825f8a'
  TRUST_RESALE_GATE_BLOB: '39e61f8497917d2cf846061d106d164c3ae3f648'
  TRUST_HISTORY_GATE_BLOB: 'ae58b60928e729d8ce872e36fc6d175ddeaca023'
  TRUST_ACQUISITION_GATE_BLOB: '50e571823cae12cad6586c5c4224d9c07c2addd9'
  TRUST_RANKING_GATE_BLOB: 'c767693a979eba42f2f8e4408ac2b3ccb035e1d0'

concurrency:
  group: huntiq-autonomous-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Re-resolve OWNER bootstrap from GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      authorized: ${{ steps.verify.outputs.authorized }}
      pending: ${{ steps.verify.outputs.pending }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      issue: ${{ steps.resolve.outputs.issue }}
      bootstrap_run: ${{ steps.resolve.outputs.bootstrap_run }}
      title_sha: ${{ steps.resolve.outputs.title_sha }}
    steps:
      - name: Resolve candidate and trusted main anchors from server
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'candidate=false' >> "$GITHUB_OUTPUT"
          [[ "$EVENT_PR_NUMBER" =~ ^[0-9]+$ ]] || exit 0

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER")"
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          creator="$(jq -r '.user.login' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          pr_body="$(jq -r '.body // ""' <<<"$pr_json")"
          [[ "$pr_number" == "$EVENT_PR_NUMBER" && "$head_sha" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$state" == 'open' && "$head_repo" == "$GITHUB_REPOSITORY" && "$creator" == 'github-actions[bot]' && "$base_ref" == 'main' ]] || exit 0
          [[ "$head_ref" =~ ^ai/issue-([0-9]+)-([0-9]+)$ ]] || exit 0
          issue="${BASH_REMATCH[1]}"
          bootstrap_run="${BASH_REMATCH[2]}"
          [[ "$pr_body" == *"Closes #${issue}"* ]] || exit 0

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue")"
          association="$(jq -r '.author_association' <<<"$issue_json")"
          title="$(jq -r '.title' <<<"$issue_json")"
          issue_author="$(jq -r '.user.login' <<<"$issue_json")"
          title_sha="$(printf '%s' "$title" | sha256sum | awk '{print $1}')"
          [[ "$association" == 'OWNER' && "$title" == '[AI BUILD]'* && "$title_sha" =~ ^[0-9a-f]{64}$ ]] || exit 0

          bootstrap_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$bootstrap_run")"
          [[ "$(jq -r '.id' <<<"$bootstrap_json")" == "$bootstrap_run" ]]
          [[ "$(jq -r '.name' <<<"$bootstrap_json")" == 'HUNTIQ autonomous task bootstrap' ]]
          [[ "$(jq -r '.path' <<<"$bootstrap_json")" == '.github/workflows/autonomous-bootstrap.yml' ]]
          [[ "$(jq -r '.event' <<<"$bootstrap_json")" == 'issues' ]]
          [[ "$(jq -r '.head_repository.full_name' <<<"$bootstrap_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.actor.login' <<<"$bootstrap_json")" == "$issue_author" ]]
          bootstrap_status="$(jq -r '.status' <<<"$bootstrap_json")"
          bootstrap_conclusion="$(jq -r '.conclusion // ""' <<<"$bootstrap_json")"
          [[ "$bootstrap_status" != 'completed' || "$bootstrap_conclusion" == 'success' ]] || exit 0

          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha')"
            [[ "$actual" == "$expected" ]] || {
              echo "::error::Trusted main anchor changed: $path" >&2
              exit 1
            }
          }
          check_blob '.github/workflows/autonomous-bootstrap.yml' "$TRUST_BOOTSTRAP_WORKFLOW_BLOB"
          check_blob '.github/workflows/agent-review.yml' "$TRUST_REVIEW_WORKFLOW_BLOB"
          check_blob 'scripts/claude-pr-review.py' "$TRUST_REVIEWER_BLOB"
          check_blob '.github/workflows/test.yml' "$TRUST_TEST_WORKFLOW_BLOB"
          check_blob 'scripts/claude-worktree-agent.py' "$TRUST_WORKTREE_AGENT_BLOB"
          check_blob 'scripts/scan-added-secrets.js' "$TRUST_SECRET_SCANNER_BLOB"
          check_blob 'tests/customer-pwa-authority-gate.test.js' "$TRUST_CUSTOMER_GATE_BLOB"
          check_blob 'tests/resale-integrity.test.js' "$TRUST_RESALE_GATE_BLOB"
          check_blob 'tests/history-identity.test.js' "$TRUST_HISTORY_GATE_BLOB"
          check_blob 'tests/acquisition-cost.test.js' "$TRUST_ACQUISITION_GATE_BLOB"
          check_blob 'tests/opportunity-ranking.test.js' "$TRUST_RANKING_GATE_BLOB"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "bootstrap_run=$bootstrap_run" >> "$GITHUB_OUTPUT"
          echo "title_sha=$title_sha" >> "$GITHUB_OUTPUT"
          echo 'candidate=true' >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate revision read-only
        if: steps.resolve.outputs.candidate == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable task packet and branch shape
        if: steps.resolve.outputs.candidate == 'true'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
          BOOTSTRAP_RUN: ${{ steps.resolve.outputs.bootstrap_run }}
          TITLE_SHA: ${{ steps.resolve.outputs.title_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'pending=false' >> "$GITHUB_OUTPUT"

          live_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.head.sha' <<<"$live_pr")" == "$HEAD_SHA" ]]
          [[ "$(jq -r '.head.ref' <<<"$live_pr")" == "$HEAD_REF" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$live_pr")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.user.login' <<<"$live_pr")" == 'github-actions[bot]' ]]
          [[ "$(jq -r '.base.ref' <<<"$live_pr")" == 'main' ]]
          [[ "$(jq -r '.state' <<<"$live_pr")" == 'open' ]]

          [[ -f .huntiq/tasks/current.md ]] || exit 0
          packet_issue="$(sed -n 's/^issue: //p' .huntiq/tasks/current.md | head -n1)"
          packet_bootstrap_run="$(sed -n 's/^bootstrap_run: //p' .huntiq/tasks/current.md | head -n1)"
          packet_association="$(sed -n 's/^bootstrap_author_association: //p' .huntiq/tasks/current.md | head -n1)"
          packet_title_sha="$(sed -n 's/^bootstrap_title_sha256: //p' .huntiq/tasks/current.md | head -n1)"
          [[ "$packet_issue" == "$ISSUE" && "$packet_bootstrap_run" == "$BOOTSTRAP_RUN" && "$packet_association" == 'OWNER' && "$packet_title_sha" == "$TITLE_SHA" ]] || exit 0

          base_sha="$(git merge-base origin/main HEAD)"
          mapfile -t branch_commits < <(git rev-list --reverse "${base_sha}..HEAD")
          [[ ${#branch_commits[@]} -eq 1 ]] || exit 0
          mapfile -t changed_paths < <(git diff --name-only "${base_sha}..HEAD")
          [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == '.huntiq/tasks/current.md' ]] || exit 0

          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          grep -q '^status: pending$' .huntiq/tasks/current.md && echo 'pending=true' >> "$GITHUB_OUTPUT" || true

  implement:
    name: Claude edit without GitHub write credentials
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact authorized revision without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK before any agent edits
        run: pip install --quiet --disable-pip-version-check "anthropic>=0.70"

      - name: Fetch ephemeral GitHub OIDC identity for Anthropic
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_path="$RUNNER_TEMP/anthropic-identity-token"
          curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$token_path"
          chmod 600 "$token_path"
          [[ -s "$token_path" ]]
          echo "token_path=$token_path" >> "$GITHUB_OUTPUT"

      - name: Implement through bounded file tools only
        env:
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_01Tu68TBrrtvigcjczbG3c8J' }}
          ANTHROPIC_BUILD_MODEL: ${{ vars.ANTHROPIC_BUILD_MODEL }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ steps.oidc.outputs.token_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/claude-worktree-agent.py \
            --mode build \
            --task .huntiq/tasks/current.md \
            --summary "$RUNNER_TEMP/huntiq-agent-summary.txt"

      - name: Enforce immutable trust boundary before creating patch
        shell: bash
        run: |
          set -euo pipefail
          protected=(
            .github/
            .gitattributes
            .gitmodules
            .npmrc
            package.json
            scripts/claude-worktree-agent.py
            scripts/autofix-attempt-ledger.js
            scripts/scan-added-secrets.js
            tests/autofix-attempt-ledger.test.js
            tests/scan-added-secrets.test.js
            tests/quality.test.js
            tests/customer-pwa-authority-gate.test.js
            tests/resale-integrity.test.js
            tests/history-identity.test.js
            tests/acquisition-cost.test.js
            tests/opportunity-ranking.test.js
            docs/autonomy-trusted-boundary-audit.md
          )
          ! git status --porcelain -- "${protected[@]}" | grep -q . || { echo '::error::Agent modified a protected trust/invariant file.'; exit 1; }
          git status --porcelain | grep -q . || { echo '::error::Agent produced no implementation change.'; exit 1; }
          grep -q '^status: pending$' .huntiq/tasks/current.md
          sed -i 's/^status: pending$/status: implemented/' .huntiq/tasks/current.md
          git add -N .
          git diff --binary --full-index HEAD > "$RUNNER_TEMP/huntiq-build.patch"
          [[ -s "$RUNNER_TEMP/huntiq-build.patch" ]]
          node scripts/scan-added-secrets.js "$RUNNER_TEMP/huntiq-build.patch"

      - name: Upload untrusted implementation patch for isolated validation
        uses: actions/upload-artifact@v4
        with:
          name: huntiq-build-patch-${{ needs.authorize.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/huntiq-build.patch
            ${{ runner.temp }}/huntiq-agent-summary.txt
          if-no-files-found: error
          retention-days: 2

  validate:
    name: Validate patch without secrets or write token
    needs: [authorize, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized base read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact implementation patch
        uses: actions/download-artifact@v4
        with:
          name: huntiq-build-patch-${{ needs.authorize.outputs.head_sha }}
          path: ${{ runner.temp }}/huntiq-build

      - name: Apply and re-check protected paths and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$(find "$RUNNER_TEMP/huntiq-build" -type f -name 'huntiq-build.patch' -print -quit)"
          [[ -s "$patch_file" ]]
          git apply --check --binary "$patch_file"
          git apply --binary "$patch_file"
          protected=(
            .github/
            .gitattributes
            .gitmodules
            .npmrc
            package.json
            scripts/claude-worktree-agent.py
            scripts/autofix-attempt-ledger.js
            scripts/scan-added-secrets.js
            tests/autofix-attempt-ledger.test.js
            tests/scan-added-secrets.test.js
            tests/quality.test.js
            tests/customer-pwa-authority-gate.test.js
            tests/resale-integrity.test.js
            tests/history-identity.test.js
            tests/acquisition-cost.test.js
            tests/opportunity-ranking.test.js
            docs/autonomy-trusted-boundary-audit.md
          )
          ! git status --porcelain -- "${protected[@]}" | grep -q . || { echo '::error::Patch touches protected trust/invariant files.'; exit 1; }
          node scripts/scan-added-secrets.js "$patch_file"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies with scripts disabled and environment scrubbed
        shell: bash
        run: env -i PATH="$PATH" HOME="$HOME" CI=true npm install --ignore-scripts --no-audit --no-fund

      - name: Run explicit HUNTIQ invariant integration gate in scrubbed environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tests/customer-pwa-authority-gate.test.js
            tests/resale-integrity.test.js
            tests/history-identity.test.js
            tests/acquisition-cost.test.js
            tests/opportunity-ranking.test.js
          )
          for test_file in "${required[@]}"; do
            [[ -s "$test_file" ]] || { echo "::error::Required invariant test missing: $test_file"; exit 1; }
            env -i PATH="$PATH" HOME="$HOME" CI=true node "$test_file"
          done

      - name: Run full HUNTIQ tests with credentials absent
        shell: bash
        run: env -i PATH="$PATH" HOME="$HOME" CI=true npm test

  publish:
    name: Re-authorize and publish validated patch only
    needs: [authorize, implement, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    steps:
      - name: Re-authorize exact PR, OWNER issue, and trusted anchors before write
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          HEAD_REF: ${{ needs.authorize.outputs.head_ref }}
          ISSUE: ${{ needs.authorize.outputs.issue }}
          BOOTSTRAP_RUN: ${{ needs.authorize.outputs.bootstrap_run }}
          TITLE_SHA: ${{ needs.authorize.outputs.title_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.head.sha' <<<"$pr_json")" == "$HEAD_SHA" ]]
          [[ "$(jq -r '.head.ref' <<<"$pr_json")" == "$HEAD_REF" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.user.login' <<<"$pr_json")" == 'github-actions[bot]' ]]
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' && "$(jq -r '.state' <<<"$pr_json")" == 'open' ]]
          [[ "$HEAD_REF" =~ ^ai/issue-${ISSUE}-${BOOTSTRAP_RUN}$ ]]
          [[ "$(jq -r '.body // ""' <<<"$pr_json")" == *"Closes #${ISSUE}"* ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")"
          title="$(jq -r '.title' <<<"$issue_json")"
          [[ "$(jq -r '.author_association' <<<"$issue_json")" == 'OWNER' && "$title" == '[AI BUILD]'* ]]
          [[ "$(printf '%s' "$title" | sha256sum | awk '{print $1}')" == "$TITLE_SHA" ]]

          bootstrap_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_RUN")"
          [[ "$(jq -r '.name' <<<"$bootstrap_json")" == 'HUNTIQ autonomous task bootstrap' ]]
          [[ "$(jq -r '.path' <<<"$bootstrap_json")" == '.github/workflows/autonomous-bootstrap.yml' ]]
          [[ "$(jq -r '.event' <<<"$bootstrap_json")" == 'issues' ]]
          [[ "$(jq -r '.head_repository.full_name' <<<"$bootstrap_json")" == "$GITHUB_REPOSITORY" ]]

          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha')"
            [[ "$actual" == "$expected" ]] || { echo "::error::Trusted main anchor changed: $path"; exit 1; }
          }
          check_blob '.github/workflows/autonomous-bootstrap.yml' "$TRUST_BOOTSTRAP_WORKFLOW_BLOB"
          check_blob '.github/workflows/agent-review.yml' "$TRUST_REVIEW_WORKFLOW_BLOB"
          check_blob 'scripts/claude-pr-review.py' "$TRUST_REVIEWER_BLOB"
          check_blob '.github/workflows/test.yml' "$TRUST_TEST_WORKFLOW_BLOB"
          check_blob 'scripts/claude-worktree-agent.py' "$TRUST_WORKTREE_AGENT_BLOB"
          check_blob 'scripts/scan-added-secrets.js' "$TRUST_SECRET_SCANNER_BLOB"
          check_blob 'tests/customer-pwa-authority-gate.test.js' "$TRUST_CUSTOMER_GATE_BLOB"
          check_blob 'tests/resale-integrity.test.js' "$TRUST_RESALE_GATE_BLOB"
          check_blob 'tests/history-identity.test.js' "$TRUST_HISTORY_GATE_BLOB"
          check_blob 'tests/acquisition-cost.test.js' "$TRUST_ACQUISITION_GATE_BLOB"
          check_blob 'tests/opportunity-ranking.test.js' "$TRUST_RANKING_GATE_BLOB"

      - name: Checkout exact still-authorized branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: huntiq-build-patch-${{ needs.authorize.outputs.head_sha }}
          path: ${{ runner.temp }}/huntiq-build

      - name: Apply validated patch and enforce final static gates
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$(find "$RUNNER_TEMP/huntiq-build" -type f -name 'huntiq-build.patch' -print -quit)"
          [[ -s "$patch_file" ]]
          git apply --check --binary "$patch_file"
          git apply --binary "$patch_file"
          protected=(
            .github/
            .gitattributes
            .gitmodules
            .npmrc
            package.json
            scripts/claude-worktree-agent.py
            scripts/autofix-attempt-ledger.js
            scripts/scan-added-secrets.js
            tests/autofix-attempt-ledger.test.js
            tests/scan-added-secrets.test.js
            tests/quality.test.js
            tests/customer-pwa-authority-gate.test.js
            tests/resale-integrity.test.js
            tests/history-identity.test.js
            tests/acquisition-cost.test.js
            tests/opportunity-ranking.test.js
            docs/autonomy-trusted-boundary-audit.md
          )
          ! git status --porcelain -- "${protected[@]}" | grep -q . || { echo '::error::Validated patch touches protected trust/invariant files.'; exit 1; }
          node scripts/scan-added-secrets.js "$patch_file"
          grep -q '^status: implemented$' .huntiq/tasks/current.md

      - name: Commit and push only to the same authorized ai branch
        env:
          HEAD_REF: ${{ needs.authorize.outputs.head_ref }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^ai/issue-[0-9]+-[0-9]+$ ]]
          git config user.name "HUNTIQ Autonomous Agent"
          git config user.email "huntiqapp-tech@users.noreply.github.com"
          git add -A
          ! git diff --cached --quiet || { echo '::error::Validated patch unexpectedly produced no commit.'; exit 1; }
          git commit -m "feat: autonomous implementation for PR #${PR_NUMBER}"
          git push origin HEAD:"$HEAD_REF"

      - name: Mark PR ready; never merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Autonomous implementation was produced without GitHub write credentials, validated in a separate credential-free job with explicit HUNTIQ invariant gates and full tests, then published after fresh server-side re-authorization. Production Claude review and the HUNTIQ project manager remain the merge gates; this workflow never merges main."
