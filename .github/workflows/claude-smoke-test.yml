name: Claude WIF smoke test

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  claude-smoke-test:
    if: contains(github.event.pull_request.title, '[claude-smoke-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims safely
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.anthropic.com")"
          JWT="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          printf '%s' "$JWT" | python3 -c 'import sys,json,base64; t=sys.stdin.read().strip(); p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); keys=["sub","aud","repository","repository_owner","event_name","ref","workflow_ref","job_workflow_ref"]; print(json.dumps({k:c.get(k) for k in keys}, indent=2, sort_keys=True))'

      - name: Test Claude Workload Identity Federation
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "Reply with exactly: HUNTIQ CLAUDE CONNECTED"
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: wrkspc_01Tu68TBrrtvigcjczbG3c8J
          anthropic_oidc_audience: https://api.anthropic.com
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: "--max-turns 1"
