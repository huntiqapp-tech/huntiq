name: HUNTIQ agent review handoff

# This workflow runs only after the HUNTIQ PR test workflow completes. The workflow
# definition itself always comes from the trusted default branch.
on:
  workflow_run:
    workflows: ["HUNTIQ tests"]
    types: [completed]

env:
  MAX_AUTOMATED_FIX_ATTEMPTS: '2'

permissions:
  contents: read

jobs:
  prepare-review:
    name: Prepare AI review packet
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      run_url: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Resolve tested PR and exact tested SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .huntiq-review
          {
            echo "repository=$REPOSITORY"
            echo "head_sha=$HEAD_SHA"
            echo "head_branch=$HEAD_BRANCH"
            echo "workflow_run=$RUN_URL"
            echo "pr_number=${PR_NUMBER:-}"
            echo "max_automated_fix_attempts=$MAX_AUTOMATED_FIX_ATTEMPTS"
            echo "auto_merge=false"
          } > .huntiq-review/metadata.txt
          echo "pr_number=${PR_NUMBER:-}" >> "$GITHUB_OUTPUT"

          if [[ -n "${PR_NUMBER:-}" ]]; then
            gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json number,title,url,baseRefName,headRefName,headRefOid,changedFiles,additions,deletions,body > .huntiq-review/pr.json
            gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > .huntiq-review/pr.diff
          else
            printf '{"warning":"workflow_run did not expose a pull request number"}\n' > .huntiq-review/pr.json
            : > .huntiq-review/pr.diff
          fi

          cat > .huntiq-review/REVIEW_INSTRUCTIONS.md <<'EOF'
          # HUNTIQ automated review contract

          Review the tested PR revision only. Do not modify or merge `main`.

          Priorities:
          1. Customer-facing evidence must fail closed when authority/provenance is missing or incomplete.
          2. Completed sales, not asking prices, drive resale valuation.
          3. Retailer price history remains retailer + product + location/channel specific.
          4. Promotions/rewards/rebates never contaminate raw shelf-price history.
          5. Affiliate value never influences Flip Score or deal ranking.
          6. Credentials and secrets never enter source, logs, browser code, or the PWA.
          7. Verify integration paths, not only isolated helper tests.

          For same-repository autonomous `ai/issue-*` PRs bootstrapped from OWNER-authored
          `[AI BUILD]` issues, automated BLOCK repairs are enabled and capped at exactly two
          attempts. The repair workflow must verify the reviewed SHA, same-repo branch,
          OWNER-authored source issue, protected workflow-file diff, and server-side attempt
          labels before it may write. Agents never merge `main`; auto-merge remains disabled
          and the project manager is the final merge gate.
          EOF

      - name: Upload review packet
        uses: actions/upload-artifact@v4
        with:
          name: huntiq-review-packet-${{ github.event.workflow_run.head_sha }}
          path: .huntiq-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  claude-review:
    name: Claude review (Anthropic WIF)
    needs: prepare-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout trusted reviewer only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/claude-pr-review.py
          sparse-checkout-cone-mode: false

      - name: Download review packet
        uses: actions/download-artifact@v4
        with:
          name: huntiq-review-packet-${{ needs.prepare-review.outputs.head_sha }}
          path: .huntiq-review

      - name: Fetch GitHub OIDC identity token for Anthropic
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_path="$RUNNER_TEMP/anthropic-identity-token"
          curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$token_path"
          chmod 600 "$token_path"
          if [[ ! -s "$token_path" ]]; then
            echo "::error::Failed to obtain a GitHub OIDC identity token." >&2
            exit 1
          fi
          echo "token_path=$token_path" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install --quiet --disable-pip-version-check "anthropic>=0.70"

      - name: Run Claude review
        id: review
        env:
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_01Tu68TBrrtvigcjczbG3c8J' }}
          ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ steps.oidc.outputs.token_path }}
          HEAD_SHA: ${{ needs.prepare-review.outputs.head_sha }}
          RUN_URL: ${{ needs.prepare-review.outputs.run_url }}
        run: |
          python3 scripts/claude-pr-review.py .huntiq-review .huntiq-review-result

      - name: Upload sanitized review result
        if: always() && steps.review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: huntiq-review-result-${{ needs.prepare-review.outputs.head_sha }}
          path: .huntiq-review-result/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  post-review:
    name: Post review to PR
    needs: [prepare-review, claude-review]
    if: needs.prepare-review.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download sanitized review result
        uses: actions/download-artifact@v4
        with:
          name: huntiq-review-result-${{ needs.prepare-review.outputs.head_sha }}
          path: .huntiq-review-result

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.prepare-review.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file .huntiq-review-result/comment.md
          echo "Posted review (verdict: $(cat .huntiq-review-result/verdict.txt)) to PR #$PR_NUMBER."
          echo "This workflow never merges anything; auto-merge remains disabled."
